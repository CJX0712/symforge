[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symforge"
version = "0.1.0"
description = "SymForge: world-class symbolic regression / formula discovery (SymFuse flagship: pure-NumPy GP + linear scaling + island migration + Pareto archive). Author: 晨星"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["symbolic-regression", "genetic-programming", "formula-discovery", "explainable-ai"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "sympy>=1.12",
]

[project.optional-dependencies]
gplearn = ["gplearn>=0.4.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16"]

[project.scripts]
symforge = "symforge.cli:main"

[tool.setuptools.packages.find]
include = ["symforge*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "N"]
ignore = [
    # 中文文档与注释中的全角标点属正常排版，非同形字漏洞
    "RUF001",
    "RUF002",
    "RUF003",
    # 科学计算惯例：X/y/N/P 大写为领域标准命名
    "N803",
    "N806",
    # dict(...)/tuple(...) 构造在动态键场景更清晰
    "C408",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
